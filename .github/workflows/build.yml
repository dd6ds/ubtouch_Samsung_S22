name: Build kernel + ubuntu.img (S22 / S22 Ultra)

# Builds the heavy, redistributable parts in the cloud. The boot images are packed
# locally afterwards, because vendor_boot must contain firmware from your own phone:
#   scripts/import-ci.sh <dev> <downloaded-artifact-dir>
#   scripts/pull-templates.sh <dev>
#   ./build.sh <dev> images pack
on:
  workflow_dispatch:
    inputs:
      devices:
        description: "Devices (r0s, b0s or both)"
        default: "both"
        type: choice
        options: [both, r0s, b0s]
      release:
        description: "Create a GitHub release after the build"
        type: boolean
        default: false
      tag:
        description: "Release tag (empty = build-<run number>)"
        type: string
        default: ""
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        device: [r0s, b0s]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      WORK: /mnt/work
      # Ubuntu's clang 18 (same as the verified local Docker build); the AOSP clang
      # archive from googlesource is ~2.5 GB and gets truncated on CI runners
      USE_SYSTEM_CLANG: "1"
    steps:
      - name: Skip unselected device
        if: github.event_name == 'workflow_dispatch' && inputs.devices != 'both' && inputs.devices != matrix.device
        run: echo "SKIP=true" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5
        if: env.SKIP != 'true'

      - name: Free disk space
        if: env.SKIP != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null || true
          sudo mkdir -p /mnt/work && sudo chown "$USER" /mnt/work
          df -h / /mnt

      - name: Host packages
        if: env.SKIP != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libelf-dev libssl-dev lz4 cpio fakeroot e2fsprogs zstd kmod clang lld llvm

      - name: Kernel
        if: env.SKIP != 'true'
        run: ./build.sh ${{ matrix.device }} kernel

      - name: ubuntu.img
        if: env.SKIP != 'true'
        run: ./build.sh ${{ matrix.device }} rootfs

      - name: Package artifacts
        if: env.SKIP != 'true'
        run: |
          D=${{ matrix.device }}; A="$RUNNER_TEMP/artifact"; mkdir -p "$A"
          tar -C "$WORK" -cf - \
              kernel-obj/$D/arch/arm64/boot/Image kernel-obj/$D/dtbs-flat \
              kernel-obj/$D/KERNELRELEASE kernel-obj/$D/.config kernel-stage/$D \
            | zstd -T0 -19 -q -o $A/kernel-$D.tar.zst
          zstd -T0 -10 -q "$WORK/out/$D/ubuntu.img" -o $A/ubuntu-$D.img.zst
          (cd $A && sha256sum * > SHA256SUMS-$D)
          ls -lh $A

      - uses: actions/upload-artifact@v5
        if: env.SKIP != 'true'
        with:
          name: s22-ut-${{ matrix.device }}
          path: ${{ runner.temp }}/artifact/*
          retention-days: 14
          compression-level: 0

  release:
    needs: build
    if: always() && !cancelled() && (startsWith(github.ref, 'refs/tags/v') || inputs.release)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: s22-ut-*
          merge-multiple: true
          path: dist

      - name: Check artifacts and split files over 2 GiB
        run: |
          cd dist
          ls *.zst >/dev/null 2>&1 || { echo "no build artifacts - all builds failed?"; exit 1; }
          # GitHub release assets are limited to 2 GiB per file;
          # scripts/import-ci.sh joins the .partNN files again
          for f in *.zst; do
            if [ "$(stat -c %s "$f")" -gt 2000000000 ]; then
              split -b 1900M -d "$f" "$f.part" && rm "$f"
            fi
          done
          ls -lh

      - name: Create release
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then TAG="${GITHUB_REF_NAME}"; else TAG="${{ inputs.tag }}"; fi
          [ -n "$TAG" ] || TAG="build-${{ github.run_number }}"
          DEVS=$(ls dist/SHA256SUMS-* | sed 's|.*SHA256SUMS-||' | tr '\n' ' ')
          cat > notes.md <<NOTES
          Experimental Ubuntu Touch 24.04-2.x (Halium 16) build for Galaxy S22 \`r0s\` / S22 Ultra \`b0s\` (Exynos, SM-S901B / SM-S908B).

          **Devices in this release:** ${DEVS}
          **Commit:** ${GITHUB_SHA::7} · **Run:** ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Contains the kernel (Image, modules, dtbs) and \`ubuntu.img\` per device. The boot images are **not** included:
          \`vendor_boot\` needs firmware from your own phone. Download the assets of your device into one folder, then:

          \`\`\`
          scripts/import-ci.sh r0s <folder>
          scripts/pull-templates.sh r0s     # phone in LineageOS recovery
          ./build.sh r0s images pack
          \`\`\`
          See README.md / README.de.md. Untested on hardware - expect to debug the first boot.
          NOTES
          sed -i 's/^          //' notes.md
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Ubuntu Touch S22 / S22 Ultra - $TAG" --notes-file notes.md --prerelease
