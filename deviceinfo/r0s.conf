# Samsung Galaxy S22 (Exynos 2200) - SM-S901B, SM-S901B/DS
# Sourced by scripts/*.sh. Values marked "template" are overridden by the
# header of a real vendor_boot.img/boot.img if you run scripts/pull-templates.sh.

deviceinfo_name="Samsung Galaxy S22"
deviceinfo_manufacturer="Samsung"
deviceinfo_codename="r0s"
deviceinfo_models="SM-S901B SM-S901B/DS"
deviceinfo_soc="s5e9925"

# ---- Ubuntu Touch / Halium ---------------------------------------------------
deviceinfo_halium_version="16"
deviceinfo_ubuntu_touch_channel="24.04-2.x/arm64/android9plus/stable"

# ---- Kernel (LineageOS 23.2 Samsung s5e9925 tree, GKI 5.10) -------------------
deviceinfo_kernel_source="https://github.com/LineageOS/android_kernel_samsung_s5e9925"
deviceinfo_kernel_source_branch="lineage-23.2"
deviceinfo_kernel_defconfig="s5e9925_defconfig r0s.config halium-samsung.config"

# Modules loaded by the Halium initramfs (first stage, from vendor_boot).
# Same list LineageOS puts in vendor_boot (BOARD_VENDOR_RAMDISK_KERNEL_MODULES_LOAD).
deviceinfo_vendor_ramdisk_modules="modules/r0s.load"
# Modules LineageOS/stock load from /vendor_dlkm. Their stock copies do not
# match our kernel, so the rootfs loads ours via /etc/modules-load.d instead.
deviceinfo_late_modules="wlan fingerprint fingerprint_sysfs input_booster_lkm"

# ---- Device tree --------------------------------------------------------------
deviceinfo_dtb_cfg="dts/s5e9925.cfg"   # -> dtb inside vendor_boot
deviceinfo_dtbo_cfg="dts/r0s.cfg"      # -> dtbo partition

# ---- Boot images (header v4: boot + vendor_boot) ------------------------------
deviceinfo_bootimg_header_version="4"
deviceinfo_bootimg_partition_size="67108864"        # boot        64 MiB
deviceinfo_vendor_boot_partition_size="33554432"    # vendor_boot 32 MiB
deviceinfo_dtbo_partition_size="8388608"            # dtbo         8 MiB
deviceinfo_bootimg_os_version="16.0.0"              # template
deviceinfo_bootimg_os_patch_level="2026-07"         # template
deviceinfo_bootimg_pagesize="2048"                  # template (mkbootimg default, as LineageOS)
deviceinfo_bootimg_base="0x10000000"                # template
deviceinfo_bootimg_kernel_offset="0x00008000"       # template
deviceinfo_bootimg_ramdisk_offset="0x01000000"      # template
deviceinfo_bootimg_tags_offset="0x00000100"         # template
deviceinfo_bootimg_dtb_offset="0x01f00000"          # template
# Appended to the vendor cmdline / bootconfig taken from the template
deviceinfo_kernel_cmdline_extra="console=tty0 loop.max_part=7 firmware_class.path=/vendor/firmware"
deviceinfo_bootconfig_extra="androidboot.selinux=permissive"

# ---- Display / Lomiri ---------------------------------------------------------
deviceinfo_screen_width="1080"
deviceinfo_screen_height="2340"
deviceinfo_gridunit="22"          # tune after first boot (bigger = larger UI)
